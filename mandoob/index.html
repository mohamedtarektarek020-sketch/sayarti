<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b2470">
<meta name="robots" content="noindex,nofollow">
<title>طلبات المناديب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f3fb; --card:#ffffff; --ink:#1c1a3a; --muted:#6b6890; --line:#e6e4f3;
  --accent:#4f46e5; --accent-ink:#ffffff; --accent-soft:#eceafe;
  --good:#15803d; --good-bg:#e8f7ee; --warn:#b45309; --warn-bg:#fff4e0; --bad:#b91c1c; --bad-bg:#fdecec; --none:#6b7280; --none-bg:#f1f1f4;
  --money:#0f766e; --money-bg:#e2f5f2; --hero1:#5b4fd6; --hero2:#2b2470;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f0e1f; --card:#1a1932; --ink:#efeefe; --muted:#a3a0c8; --line:#2c2a4d;
  --accent:#8b83ff; --accent-ink:#0f0e1f; --accent-soft:#26244a;
  --good:#4ade80; --good-bg:#12301f; --warn:#fbbf24; --warn-bg:#3a2a0c; --bad:#f87171; --bad-bg:#3b1515; --none:#9ca3af; --none-bg:#23223a;
  --money:#5eead4; --money-bg:#0f2f2c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0e1f; --card:#1a1932; --ink:#efeefe; --muted:#a3a0c8; --line:#2c2a4d;
  --accent:#8b83ff; --accent-ink:#0f0e1f; --accent-soft:#26244a;
  --good:#4ade80; --good-bg:#12301f; --warn:#fbbf24; --warn-bg:#3a2a0c; --bad:#f87171; --bad-bg:#3b1515; --none:#9ca3af; --none-bg:#23223a;
  --money:#5eead4; --money-bg:#0f2f2c; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Tajawal","Noto Sans Bengali",system-ui,sans-serif;font-size:16px;min-height:100vh;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.hero{background:linear-gradient(150deg,var(--hero1),var(--hero2));color:#fff;padding:calc(26px + env(safe-area-inset-top,0px)) 20px 70px;text-align:center;border-radius:0 0 28px 28px}
.hero .logo{width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.15);display:inline-flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:10px}
.hero h1{margin:0;font-size:24px;font-weight:800}
.langs{display:flex;gap:6px;justify-content:center;margin:0 0 14px}
.langs button{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:999px;padding:5px 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.langs button[aria-pressed="true"]{background:#fff;color:var(--hero2)}
.hero p{margin:6px 0 0;opacity:.85;font-size:14.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 28px rgba(30,20,90,.08)}
.lift{margin-top:-46px}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
textarea{min-height:110px;resize:vertical;line-height:1.6}
#iqama{text-align:center;font-size:20px;letter-spacing:1px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.6}
button{font:inherit;cursor:pointer}
.main{width:100%;margin-top:18px;padding:14px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-size:17px;font-weight:800}
.main:disabled{opacity:.6}
.ghost{background:transparent;border:1.5px solid var(--line);color:var(--muted);border-radius:12px;padding:8px 12px;font-size:13.5px;font-weight:700;white-space:nowrap}
.err{display:none;margin-top:12px;padding:11px 12px;border-radius:12px;background:var(--bad-bg);color:var(--bad);font-weight:700;font-size:14px;text-align:center;line-height:1.6}
.hidden{display:none!important}
.who{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.who .nm{font-weight:800;font-size:19px;line-height:1.4}
.who .meta{color:var(--muted);font-size:13.5px;margin-top:4px;line-height:1.6}
.choices{display:grid;gap:12px;margin-top:16px}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;color:var(--ink)}
.choice:hover{border-color:var(--accent)}
.choice.closed{opacity:.6;background:var(--line)}.choice.closed .t2{color:var(--bad);font-weight:700}
.req .rep.auto{border:1px dashed var(--muted);color:var(--muted)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:12px 18px;border-radius:14px;z-index:50;max-width:calc(100% - 32px);font-weight:700;text-align:center;line-height:1.6}
.choice .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.choice .t1{font-weight:800;font-size:17px}
.choice .t2{color:var(--muted);font-size:13.5px;margin-top:3px}
.ic.b{background:var(--good-bg)} .ic.m{background:var(--money-bg)} .ic.c{background:var(--warn-bg)} .ic.l{background:var(--accent-soft)}
.back{display:inline-flex;align-items:center;gap:6px;margin:16px 4px 10px;background:none;border:0;color:var(--muted);font-weight:700;font-size:14.5px;padding:0}
h2{font-size:18px;margin:0 0 4px;font-weight:800}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;line-height:1.6;font-weight:500}
.chk input{width:20px;height:20px;flex-shrink:0;margin-top:3px;accent-color:var(--accent)}
.done{text-align:center;padding:26px 18px}
.done .big{font-size:46px}
.done .no{display:inline-block;margin-top:10px;background:var(--accent-soft);padding:8px 16px;border-radius:12px;font-weight:800;font-size:20px;letter-spacing:1px}
.req{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.req .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.req .t1{font-weight:800}
.req .t2{color:var(--muted);font-size:13.5px;margin-top:4px}
.req .rep{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--bg);font-size:14px;line-height:1.6}
.pill{font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap}
.s-new{background:var(--accent-soft);color:var(--accent)} .s-rev{background:var(--warn-bg);color:var(--warn)} .s-ok{background:var(--good-bg);color:var(--good)} .s-no{background:var(--bad-bg);color:var(--bad)}
.wa{display:block;text-align:center;margin-top:12px;padding:13px;border-radius:14px;background:#16a34a;color:#fff;font-weight:800;text-decoration:none}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
/* birth */
.bd{display:grid;grid-template-columns:1fr 1.4fr 1.2fr;gap:8px}
.bd select{text-align:center;padding:12px 6px}
.ibbox{margin-top:14px;padding:4px 12px 12px;border:1.5px dashed var(--line);border-radius:14px;background:var(--bg)}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:24px;line-height:1.8}
bdi{unicode-bidi:isolate}
</style>
</head>
<body>
<div class="hero"><div class="langs" role="group" aria-label="Language"><button type="button" data-lang="ar">عربي</button><button type="button" data-lang="en">English</button><button type="button" data-lang="bn">বাংলা</button></div><div class="logo">🧾</div><h1 data-t="title">طلبات المناديب</h1><p id="heroSub">طلب سلفة أو تقديم شكوى</p></div>
<div class="wrap">

  <!-- الدخول -->
  <section id="vLogin" class="card lift">
    <label for="iqama" data-t="iqLabel">رقم الإقامة</label>
    <input id="iqama" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="2xxxxxxxxx">
    <div class="hint" id="iqHint" data-t="iqHint">اكتب رقم الإقامة بتاعك (10 أرقام) علشان تدخل.</div>
    <div id="bdBox" class="hidden">
      <label data-t="bdLabel">تاريخ الميلاد (زي ما هو في الإقامة)</label>
      <div class="bd"><select id="bdD" aria-label="اليوم" data-ta="day"></select><select id="bdM" aria-label="الشهر" data-ta="month"></select><select id="bdY" aria-label="السنة" data-ta="year"></select></div>
      <div class="hint" data-t="bdHint">للتأكد إنك صاحب الإقامة.</div>
    </div>
    <button class="main" id="goBtn" type="button">التالي</button>
    <div class="err" id="err"></div>
  </section>

  <!-- الاختيارات -->
  <section id="vHome" class="hidden">
    <div class="card lift"><div class="who"><div><div class="nm" id="whoName"></div><div class="meta" id="whoMeta"></div></div><button class="ghost" id="outBtn" type="button" data-t="logout">خروج</button></div></div>
    <div class="choices">
      <button class="choice" type="button" data-go="adv"><span class="ic m">💰</span><span><div class="t1" data-t="advT1">طلب سلفة</div><div class="t2">اطلب مبلغ مقدم وبيتخصم من راتبك</div></span></button>
      <button class="choice" type="button" data-go="cmp"><span class="ic c">📝</span><span><div class="t1" data-t="cmpT1">تقديم شكوى</div><div class="t2" data-t="cmpT2">راتب، خصم، بنزين، سيارة، مشرف أو أي مشكلة</div></span></button>
      <button class="choice" type="button" data-go="list"><span class="ic l">📋</span><span><div class="t1" data-t="listT1">طلباتي</div><div class="t2" data-t="listT2">تابع حالة الطلبات اللي قدمتها</div></span></button>
    </div>
  </section>

  <!-- السلفة -->
  <section id="vAdv" class="hidden">
    <button class="back" type="button" data-go="home" data-t="back">→ رجوع</button>
    <div class="card"><h2 data-t="advH">💰 طلب سلفة</h2>
      <label for="aAmt" data-t="amt">المبلغ المطلوب (ريال)</label><input id="aAmt" type="number" inputmode="numeric" min="1" max="20000" placeholder="مثلاً 500" data-tp="amtPh">
      <label for="aReason" data-t="reason">سبب السلفة</label>
      <select id="aReason"><option value="" data-t="chooseReason">اختار السبب</option><option value="ظروف عائلية" data-t="ظروف عائلية">ظروف عائلية</option><option value="علاج" data-t="علاج">علاج</option><option value="إيجار سكن" data-t="إيجار سكن">إيجار سكن</option><option value="سفر / إجازة" data-t="سفر / إجازة">سفر / إجازة</option><option value="مصاريف السيارة" data-t="مصاريف السيارة">مصاريف السيارة</option><option value="أخرى" data-t="أخرى">أخرى</option></select>
      <label for="aDet" data-t="det">تفاصيل (اختياري)</label><textarea id="aDet" maxlength="1500" placeholder="اكتب أي تفاصيل تساعد في الموافقة" data-tp="detPh"></textarea>
      <div class="ibbox">
        <label for="aIban" data-t="ibLabel">🏦 الآيبان اللي هتنزل عليه السلفة</label>
        <div class="hint" id="ibNow"></div>
        <input id="aIban" dir="ltr" autocomplete="off" autocapitalize="characters" maxlength="34" placeholder="SA00 0000 0000 0000 0000 0000" style="text-align:left;letter-spacing:.5px">
        <div class="hint" id="ibBank"></div>
        <div class="hint" data-t="ibMine">لازم يكون الآيبان باسمك إنت.</div>
      </div>
      <label for="aPh" data-t="phone">رقم الجوال</label><input id="aPh" type="tel" inputmode="tel" maxlength="15" placeholder="05xxxxxxxx">
      <label class="chk"><input type="checkbox" id="aOk"> <span data-t="agree">أوافق إن مبلغ السلفة يتخصم من راتبي حسب نظام الشركة، وإن بيانات الحساب البنكي صحيحة.</span></label>
      <button class="main" id="aSend" type="button" data-t="advSend">إرسال طلب السلفة</button>
      <div class="err" id="aErr"></div>
    </div>
  </section>

  <!-- الشكوى -->
  <section id="vCmp" class="hidden">
    <button class="back" type="button" data-go="home" data-t="back">→ رجوع</button>
    <div class="card"><h2 data-t="cmpH">📝 تقديم شكوى</h2>
      <label for="cCat" data-t="cCat">نوع الشكوى</label>
      <select id="cCat"><option value="" data-t="chooseType">اختار النوع</option><option value="الراتب" data-t="الراتب">الراتب</option><option value="خصم أو مديونية" data-t="خصم أو مديونية">خصم أو مديونية</option><option value="البنزين / الشريحة" data-t="البنزين / الشريحة">البنزين / الشريحة</option><option value="السيارة" data-t="السيارة">السيارة</option><option value="المشرف" data-t="المشرف">المشرف</option><option value="التطبيق / الحساب" data-t="التطبيق / الحساب">التطبيق / الحساب</option><option value="أخرى" data-t="أخرى">أخرى</option></select>
      <label for="cDet" data-t="cDet">اكتب الشكوى بالتفصيل</label><textarea id="cDet" maxlength="1500" placeholder="إيه المشكلة؟ وإمتى حصلت؟" data-tp="cDetPh"></textarea>
      <label for="cPh" data-t="phone">رقم الجوال</label><input id="cPh" type="tel" inputmode="tel" maxlength="15" placeholder="05xxxxxxxx">
      <button class="main" id="cSend" type="button" data-t="cSend">إرسال الشكوى</button>
      <div class="err" id="cErr"></div>
    </div>
  </section>

  <!-- تم -->
  <section id="vDone" class="hidden">
    <div class="card lift done"><div class="big">✅</div><h2 id="dTitle">تم إرسال طلبك</h2><div class="hint" id="dSub">احتفظ برقم الطلب علشان تتابعه</div><div class="no" id="dNo"></div>
            <button class="main" type="button" data-go="list" data-t="listT1">طلباتي</button><button class="ghost" style="width:100%;margin-top:10px;padding:12px" type="button" data-go="home" data-t="goHome">الرجوع للرئيسية</button></div>
  </section>

  <!-- طلباتي -->
  <section id="vList" class="hidden">
    <button class="back" type="button" data-go="home" data-t="back">→ رجوع</button>
    <h2 style="margin:0 4px 10px" data-t="listH">📋 طلباتي</h2>
    <div id="lBox"></div>
  </section>

</div>

<script>
/* ===== الإعداد ===== */
// رابط Google Apps Script بعد النشر (Web app)
const API = "https://script.google.com/macros/s/AKfycbwgosZcM5Q2Rw1x_y0sDelBpurZC49xwO6JT-4zb9CdOoxGfxm7l7xKpxPR2LOBuZlIGg/exec";

  listT1: ["طلباتي", "My requests", "আমার আবেদনসমূহ"],
  listT2: ["تابع حالة الطلبات اللي قدمتها", "Track the status of your requests", "আপনার আবেদনের অবস্থা দেখুন"],
  back: ["→ رجوع", "← Back", "← ফিরে যান"],
  advH: ["💰 طلب سلفة", "💰 Advance request", "💰 অগ্রিম টাকার আবেদন"],
  amt: ["المبلغ المطلوب (ريال)", "Amount requested (SAR)", "চাওয়া টাকার পরিমাণ (রিয়াল)"],

  chooseReason: ["اختار السبب", "Choose a reason", "কারণ বেছে নিন"],

const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };
let ME = null, IQ = "";

async function sha256hex(s) { const h = await crypto.subtle.digest("SHA-256", enc.encode(s)); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join(""); }
async function deriveKey(s) {
  const base = await crypto.subtle.importKey("raw", enc.encode(s), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: enc.encode(SALT), iterations: 120000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}
let DATA = null;
async function loadData() { if (DATA) return DATA; const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) throw new Error("data"); DATA = await r.json(); return DATA; }

function show(v) {
  ["vLogin", "vHome", "vAdv", "vCmp", "vDone", "vList"].forEach(x => $(x).classList.toggle("hidden", x !== v));
  if (v === "vHome") advState();
  window.scrollTo(0, 0);
}
function err(id, m) { const e = $(id); e.textContent = m || ""; e.style.display = m ? "block" : "none"; }
const accTxt = () => (ME.acc || []).map(a => a.p + " " + a.id).join(" + ");

function buildBd() {
  const keep = ["bdD", "bdM", "bdY"].map(x => $(x).value), M = T("months");
  $("bdD").innerHTML = `<option value="">${T("day")}</option>` + Array.from({ length: 31 }, (_, i) => `<option value="${String(i + 1).padStart(2, "0")}">${i + 1}</option>`).join("");
  $("bdM").innerHTML = `<option value="">${T("month")}</option>` + M.map((m, i) => `<option value="${String(i + 1).padStart(2, "0")}">${i + 1} - ${m}</option>`).join("");
  const y = new Date().getFullYear(); let o = `<option value="">${T("year")}</option>`; for (let k = y - 16; k >= y - 75; k--) o += `<option>${k}</option>`; $("bdY").innerHTML = o;
  ["bdD", "bdM", "bdY"].forEach((x, i) => { $(x).value = keep[i]; });
}
buildBd();
let PEND = null; // {iq, blob, needBd}
function resetLogin() { PEND = null; $("bdBox").classList.add("hidden"); $("iqHint").classList.remove("hidden"); $("goBtn").textContent = T("next"); ["bdD", "bdM", "bdY"].forEach(x => $(x).value = ""); }
async function openBlob(iq, blob, secret) {
  const rawb = Uint8Array.from(atob(blob), c => c.charCodeAt(0));
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: rawb.slice(0, 12) }, await deriveKey(secret), rawb.slice(12));
  return JSON.parse(new TextDecoder().decode(plain));
}
function enter(iq, obj, tok) {
  ME = obj; IQ = iq; TOK = tok;
  store.set("tq_s", JSON.stringify({ iq, tok, s: SECRET }));
  $("whoName").textContent = ME.n || T("driver");
  const a = ME.acc && ME.acc[0];
  $("whoMeta").innerHTML = [`${T("iqShort")}: <bdi dir="ltr">${iq}</bdi>`, ME.acc && ME.acc.length ? esc(ME.acc.map(x => x.p).join(" + ")) : "", a && a.s ? T("supShort") + ": <bdi>" + esc(a.s) + "</bdi>" : ""].filter(Boolean).join(" · ");
  const ph = ME.ph ? "0" + String(ME.ph).replace(/^0+/, "") : ""; $("aPh").value = ph; $("cPh").value = ph;
  updateHero();
  resetLogin(); show("vHome");
}
let TOK = "", SECRET = "";
async function login(raw) {
  err("err", "");
  const b = $("goBtn");
  try {
    if (PEND && PEND.needBd) { // الخطوة التانية: تاريخ الميلاد
      const d = $("bdD").value, m = $("bdM").value, y = $("bdY").value;
      if (!d || !m || !y) { err("err", T("e_bdPick")); return; }
      b.disabled = true; b.innerHTML = '<span class="spin"></span> ' + T("verifying");
      const secret = PEND.iq + "|" + y + "-" + m + "-" + d;
      let obj; try { obj = await openBlob(PEND.iq, PEND.blob, secret); } catch (e) { err("err", T("e_bdWrong")); return; }
      SECRET = secret; enter(PEND.iq, obj, (await sha256hex("tok:" + secret)).slice(0, 32)); return;
    }
    const iq = toLatin(raw).replace(/\D/g, "");
    if (!/^[12]\d{9}$/.test(iq)) { err("err", T("e_iqFmt")); return; }
    b.disabled = true; b.innerHTML = '<span class="spin"></span> ' + T("searching");
    const data = await loadData();
    const rec = data.d[(await sha256hex("req:" + iq)).slice(0, 24)];
    if (!rec) { err("err", T("e_iqNone")); return; }
    const needBd = rec.startsWith("b:"), blob = rec.slice(2);
    if (needBd) { PEND = { iq, blob, needBd }; $("iqHint").classList.add("hidden"); $("bdBox").classList.remove("hidden"); return; }
    SECRET = iq; enter(iq, await openBlob(iq, blob, iq), (await sha256hex("tok:" + iq)).slice(0, 32));
  } catch (e) { err("err", T("e_load")); }
  finally { b.disabled = false; b.textContent = PEND && PEND.needBd ? T("signIn") : T("next"); }
}

function payload(type) {
  const a = ME.acc && ME.acc[0];
  return { action: "submit", type, iq: IQ, tok: TOK, name: ME.n || "", acc: accTxt(), sup: a ? a.s || "" : "", city: ME.c || "" };
}
// السلف متاحة يوميًا من 10 الصبح لـ 1 الضهر بتوقيت السعودية (والسيرفر بيرفض أي طلب برّه الوقت ده)
const ADV_FROM = 10, ADV_TO = 13;
const riyadhHour = () => { try { return Number(new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Riyadh", hour: "numeric", hourCycle: "h23" }).format(new Date())); } catch (e) { return (new Date().getUTCHours() + 3) % 24; } };
const advOpen = () => { const h = riyadhHour(); return h >= ADV_FROM && h < ADV_TO; };

function toast(t) { const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 3500); }
function advState() { const b = document.querySelector('[data-go="adv"]'); if (!b) return; const o = advOpen(); b.classList.toggle("closed", !o); b.querySelector(".t2").textContent = o ? T("advOpenNow") : "🕐 " + T("advHours"); }
setInterval(advState, 30000);
// رد تلقائي بيظهر للمندوب لحد ما الإدارة ترد بنفسها
const AUTO_K = { "سلفة": "autoAdv", "شكوى": "autoCmp", "آيبان": "autoIb" };
const AUTO = t => AUTO_K[t] ? T(AUTO_K[t]) : "";
const ERR = k => k === "closed" ? T("advHours") + T("eTryHours") : L["e_" + k] ? T("e_" + k) : T("e_generic");

async function send(p, btn, errId) {
  err(errId, "");
  if (!API) { err(errId, T("e_notReady")); return; }
  const label = btn.textContent; btn.disabled = true; btn.innerHTML = '<span class="spin"></span> ' + T("sending");
  try {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(p) });
    const j = await r.json();
    if (!j.ok) { err(errId, ERR(j.err)); return; }
    $("dTitle").textContent = T(p.type === "سلفة" ? "doneAdv" : p.type === "آيبان" ? "doneIb" : "doneCmp"); $("dSub").textContent = AUTO(p.type) || T("keepNo");
    $("dNo").classList.remove("hidden"); $("dNo").textContent = j.no;
    ["aAmt", "aDet", "cDet", "aIban"].forEach(id => $(id).value = ""); $("ibBank").textContent = ""; $("aReason").value = ""; $("cCat").value = ""; $("aOk").checked = false;
    show("vDone");
  } catch (e) {
    err(errId, T("e_net"));
  } finally { btn.disabled = false; btn.textContent = label; }
}
const phOk = v => /^0?5\d{8}$/.test(toLatin(v).replace(/\D/g, ""));

$("aSend").onclick = () => {
  const amt = Math.round(Number(toLatin($("aAmt").value)));
  if (!(amt > 0)) return err("aErr", T("e_amtNeed"));
  if (amt > 20000) return err("aErr", T("e_amtBig"));
  if (!$("aReason").value) return err("aErr", T("e_reason"));
  const ib = ibClean($("aIban").value);
  if (!ibOk(ib)) return err("aErr", T("e_ibFmt"));
  const holder = ME.n || "";
  if (!phOk($("aPh").value)) return err("aErr", T("e_phone"));
  if (!$("aOk").checked) return err("aErr", T("e_agree"));
  const det = $("aDet").value.trim();
  send(Object.assign(payload("سلفة"), { amount: amt, reason: $("aReason").value, iban: ib, bank: ibBank(ib), holder, details: (det ? det + "\n" : "") + "الآيبان: " + ibFmt(ib) + " (" + ibBank(ib) + ") — باسم المندوب", phone: toLatin($("aPh").value).replace(/\D/g, "") }), $("aSend"), "aErr");
};
$("cSend").onclick = () => {
  if (!$("cCat").value) return err("cErr", T("e_cat"));
  if ($("cDet").value.trim().length < 5) return err("cErr", T("e_cmpDet"));
  if (!phOk($("cPh").value)) return err("cErr", T("e_phone"));
  send(Object.assign(payload("شكوى"), { reason: $("cCat").value, details: $("cDet").value.trim(), phone: toLatin($("cPh").value).replace(/\D/g, "") }), $("cSend"), "cErr");
};

/* ===== الآيبان ===== */
const BANKS = { "05": "مصرف الإنماء", "10": "البنك الأهلي السعودي", "15": "بنك البلاد", "20": "بنك الرياض", "30": "البنك العربي الوطني", "40": "البنك الأهلي السعودي (سامبا)", "45": "البنك السعودي الأول (ساب)", "50": "البنك السعودي الأول (الأول)", "55": "البنك السعودي الفرنسي", "60": "بنك الجزيرة", "65": "البنك السعودي للاستثمار", "71": "بنك الخليج الدولي", "76": "بنك مسقط", "80": "مصرف الراجحي", "90": "بنك الخليج الدولي", "95": "بنك الإمارات دبي الوطني" };
const ibClean = v => toLatin(v).toUpperCase().replace(/[^A-Z0-9]/g, "");
function ibOk(v) {
  const x = ibClean(v); if (!/^SA\d{22}$/.test(x)) return false;
  const r = x.slice(4) + x.slice(0, 4); let m = 0;
  for (const ch of r) { const n = /[A-Z]/.test(ch) ? String(ch.charCodeAt(0) - 55) : ch; for (const d of n) m = (m * 10 + +d) % 97; }
  return m === 1;
}
const ibBank = v => { const x = ibClean(v); return /^SA\d{4}/.test(x) ? (BANKS[x.slice(4, 6)] || "بنك آخر") : ""; };
const ibFmt = x => x.replace(/(.{4})/g, "$1 ").trim();
$("aIban").addEventListener("input", () => { err("aErr", ""); const x = ibClean($("aIban").value); $("ibBank").textContent = x.length >= 6 ? (ibBank(x) + (x.length === 24 ? (ibOk(x) ? T("ibGood") : T("ibBad")) : "")) : ""; });

const ST = { "جديد": "s-new", "تحت المراجعة": "s-rev", "تمت الموافقة": "s-ok", "تم الحل": "s-ok", "مرفوض": "s-no" };
async function loadList() {
  const box = $("lBox");
  if (!API) { box.innerHTML = `<div class="card hint" style="text-align:center">${T("listSoon")}</div>`; return; }
  box.innerHTML = `<div class="card hint" style="text-align:center">${T("loading")}</div>`;
  try {
    const j = await (await fetch(API + "?action=status&iq=" + IQ + "&tok=" + TOK)).json();
    if (!j.ok) throw 0;
    box.innerHTML = j.list.length ? j.list.map(r => `<div class="req"><div class="top"><div class="t1">${r.type === "سلفة" ? T("tAdv") + (r.amount ? " — " + Number(r.amount).toLocaleString("en-US") + " " + T("sar") : "") : r.type === "آيبان" ? T("tIb") + " — " + esc(r.reason) : T("tCmp") + " — " + esc(T(r.reason))}</div><span class="pill ${ST[r.status] || "s-new"}">${esc(T(r.status))}</span></div>
      <div class="t2">${T("reqNo")} <bdi dir="ltr">${esc(r.no)}</bdi> · <bdi dir="ltr">${esc(r.date)}</bdi></div>${r.reply ? `<div class="rep"><b>${T(r.by === "الشؤون القانونية" ? "replyLegal" : "replyAdmin")}:</b> ${esc(r.reply)}</div>` : (r.status === "جديد" || r.status === "تحت المراجعة") && AUTO(r.type) ? `<div class="rep auto"><b>${T("autoLbl")}:</b> ${AUTO(r.type)}</div>` : ""}</div>`).join("")
      : `<div class="card hint" style="text-align:center">${T("noReqs")}</div>`;
  } catch (e) { box.innerHTML = `<div class="card hint" style="text-align:center">${T("listFail")}</div>`; }
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]"); if (!b) return;
  const g = b.dataset.go;
  if (g === "home") show("vHome"); else if (g === "adv") { if (!advOpen()) { advState(); toast(T("advHours")); return; } err("aErr", ""); ibNowTxt(); show("vAdv"); } else if (g === "cmp") { err("cErr", ""); show("vCmp"); } else if (g === "list") { show("vList"); loadList(); }
});
$("goBtn").onclick = () => login($("iqama").value);
$("iqama").addEventListener("keydown", e => { if (e.key === "Enter") $("goBtn").click(); });
$("outBtn").onclick = () => { store.del("tq_s"); ME = null; IQ = ""; TOK = ""; SECRET = ""; $("iqama").value = ""; resetLogin(); updateHero(); show("vLogin"); };
$("iqama").addEventListener("input", () => { if (PEND) resetLogin(); });
function updateHero() { $("heroSub").textContent = ME ? T("hello", String(ME.n || "").split(" ")[0]) : T("heroSub"); }
function ibNowTxt() { $("ibNow").textContent = ME && ME.ib ? T("ibNowHas", ME.ib) : T("ibNowNone"); }
function setLang(l) {
  LANG = LANGS.includes(l) ? l : "ar"; try { localStorage.setItem("tq_lang", LANG); } catch (e) {}
  applyLang(); buildBd(); advState(); updateHero(); if (ME) ibNowTxt();
  if (!$("goBtn").disabled) $("goBtn").textContent = PEND && PEND.needBd ? T("signIn") : T("next");
  if (!$("vList").classList.contains("hidden")) loadList();
}
document.querySelectorAll(".langs button").forEach(b => b.onclick = () => setLang(b.dataset.lang));
setLang(LANG);
(async () => { try { const s = JSON.parse(store.get("tq_s") || "null"); if (!s) return; const data = await loadData(); const rec = data.d[(await sha256hex("req:" + s.iq)).slice(0, 24)]; if (!rec) return;
  SECRET = s.s; enter(s.iq, await openBlob(s.iq, rec.slice(2), s.s), s.tok); } catch (e) { store.del("tq_s"); } })();
</script>
</body>
</html>
