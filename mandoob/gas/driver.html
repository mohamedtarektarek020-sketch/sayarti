<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b2470">
<meta name="robots" content="noindex,nofollow">
<title>طلبات المناديب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f3fb; --card:#ffffff; --ink:#1c1a3a; --muted:#6b6890; --line:#e6e4f3;
  --accent:#4f46e5; --accent-ink:#ffffff; --accent-soft:#eceafe;
  --good:#15803d; --good-bg:#e8f7ee; --warn:#b45309; --warn-bg:#fff4e0; --bad:#b91c1c; --bad-bg:#fdecec; --none:#6b7280; --none-bg:#f1f1f4;
  --money:#0f766e; --money-bg:#e2f5f2; --hero1:#5b4fd6; --hero2:#2b2470;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f0e1f; --card:#1a1932; --ink:#efeefe; --muted:#a3a0c8; --line:#2c2a4d;
  --accent:#8b83ff; --accent-ink:#0f0e1f; --accent-soft:#26244a;
  --good:#4ade80; --good-bg:#12301f; --warn:#fbbf24; --warn-bg:#3a2a0c; --bad:#f87171; --bad-bg:#3b1515; --none:#9ca3af; --none-bg:#23223a;
  --money:#5eead4; --money-bg:#0f2f2c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0e1f; --card:#1a1932; --ink:#efeefe; --muted:#a3a0c8; --line:#2c2a4d;
  --accent:#8b83ff; --accent-ink:#0f0e1f; --accent-soft:#26244a;
  --good:#4ade80; --good-bg:#12301f; --warn:#fbbf24; --warn-bg:#3a2a0c; --bad:#f87171; --bad-bg:#3b1515; --none:#9ca3af; --none-bg:#23223a;
  --money:#5eead4; --money-bg:#0f2f2c; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;font-size:16px;min-height:100vh;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.hero{background:linear-gradient(150deg,var(--hero1),var(--hero2));color:#fff;padding:calc(26px + env(safe-area-inset-top,0px)) 20px 70px;text-align:center;border-radius:0 0 28px 28px}
.hero .logo{width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.15);display:inline-flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:10px}
.hero h1{margin:0;font-size:24px;font-weight:800}
.hero p{margin:6px 0 0;opacity:.85;font-size:14.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 28px rgba(30,20,90,.08)}
.lift{margin-top:-46px}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
textarea{min-height:110px;resize:vertical;line-height:1.6}
#iqama{text-align:center;font-size:20px;letter-spacing:1px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.6}
button{font:inherit;cursor:pointer}
.main{width:100%;margin-top:18px;padding:14px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-size:17px;font-weight:800}
.main:disabled{opacity:.6}
.ghost{background:transparent;border:1.5px solid var(--line);color:var(--muted);border-radius:12px;padding:8px 12px;font-size:13.5px;font-weight:700;white-space:nowrap}
.err{display:none;margin-top:12px;padding:11px 12px;border-radius:12px;background:var(--bad-bg);color:var(--bad);font-weight:700;font-size:14px;text-align:center;line-height:1.6}
.hidden{display:none!important}
.who{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.who .nm{font-weight:800;font-size:19px;line-height:1.4}
.who .meta{color:var(--muted);font-size:13.5px;margin-top:4px;line-height:1.6}
.choices{display:grid;gap:12px;margin-top:16px}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;color:var(--ink)}
.choice:hover{border-color:var(--accent)}
.choice.closed{opacity:.6;background:var(--line)}.choice.closed .t2{color:var(--bad);font-weight:700}
.req .rep.auto{border:1px dashed var(--muted);color:var(--muted)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:12px 18px;border-radius:14px;z-index:50;max-width:calc(100% - 32px);font-weight:700;text-align:center;line-height:1.6}
.choice .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.choice .t1{font-weight:800;font-size:17px}
.choice .t2{color:var(--muted);font-size:13.5px;margin-top:3px}
.ic.b{background:var(--good-bg)} .ic.m{background:var(--money-bg)} .ic.c{background:var(--warn-bg)} .ic.l{background:var(--accent-soft)}
.back{display:inline-flex;align-items:center;gap:6px;margin:16px 4px 10px;background:none;border:0;color:var(--muted);font-weight:700;font-size:14.5px;padding:0}
h2{font-size:18px;margin:0 0 4px;font-weight:800}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;line-height:1.6;font-weight:500}
.chk input{width:20px;height:20px;flex-shrink:0;margin-top:3px;accent-color:var(--accent)}
.done{text-align:center;padding:26px 18px}
.done .big{font-size:46px}
.done .no{display:inline-block;margin-top:10px;background:var(--accent-soft);padding:8px 16px;border-radius:12px;font-weight:800;font-size:20px;letter-spacing:1px}
.req{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.req .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.req .t1{font-weight:800}
.req .t2{color:var(--muted);font-size:13.5px;margin-top:4px}
.req .rep{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--bg);font-size:14px;line-height:1.6}
.pill{font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap}
.s-new{background:var(--accent-soft);color:var(--accent)} .s-rev{background:var(--warn-bg);color:var(--warn)} .s-ok{background:var(--good-bg);color:var(--good)} .s-no{background:var(--bad-bg);color:var(--bad)}
.wa{display:block;text-align:center;margin-top:12px;padding:13px;border-radius:14px;background:#16a34a;color:#fff;font-weight:800;text-decoration:none}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
/* birth */
.bd{display:grid;grid-template-columns:1fr 1.4fr 1.2fr;gap:8px}
.bd select{text-align:center;padding:12px 6px}
.ibbox{margin-top:14px;padding:4px 12px 12px;border:1.5px dashed var(--line);border-radius:14px;background:var(--bg)}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:24px;line-height:1.8}
bdi{unicode-bidi:isolate}
</style>
</head>
<body>
<div class="hero"><div class="logo">🧾</div><h1>طلبات المناديب</h1><p id="heroSub">طلب سلفة أو تقديم شكوى</p></div>
<div class="wrap">

  <!-- الدخول -->
  <section id="vLogin" class="card lift">
    <label for="iqama">رقم الإقامة</label>
    <input id="iqama" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="2xxxxxxxxx">
    <div class="hint" id="iqHint">اكتب رقم الإقامة بتاعك (10 أرقام) علشان تدخل.</div>
    <div id="bdBox" class="hidden">
      <label>تاريخ الميلاد (زي ما هو في الإقامة)</label>
      <div class="bd"><select id="bdD" aria-label="اليوم"></select><select id="bdM" aria-label="الشهر"></select><select id="bdY" aria-label="السنة"></select></div>
      <div class="hint">للتأكد إنك صاحب الإقامة.</div>
    </div>
    <button class="main" id="goBtn" type="button">التالي</button>
    <div class="err" id="err"></div>
  </section>

  <!-- الاختيارات -->
  <section id="vHome" class="hidden">
    <div class="card lift"><div class="who"><div><div class="nm" id="whoName"></div><div class="meta" id="whoMeta"></div></div><button class="ghost" id="outBtn" type="button">خروج</button></div></div>
    <div class="choices">
      <button class="choice" type="button" data-go="adv"><span class="ic m">💰</span><span><div class="t1">طلب سلفة</div><div class="t2">اطلب مبلغ مقدم وبيتخصم من راتبك</div></span></button>
      <button class="choice" type="button" data-go="cmp"><span class="ic c">📝</span><span><div class="t1">تقديم شكوى</div><div class="t2">راتب، خصم، بنزين، سيارة، مشرف أو أي مشكلة</div></span></button>
      <button class="choice" type="button" data-go="list"><span class="ic l">📋</span><span><div class="t1">طلباتي</div><div class="t2">تابع حالة الطلبات اللي قدمتها</div></span></button>
    </div>
  </section>

  <!-- السلفة -->
  <section id="vAdv" class="hidden">
    <button class="back" type="button" data-go="home">→ رجوع</button>
    <div class="card"><h2>💰 طلب سلفة</h2>
      <label for="aAmt">المبلغ المطلوب (ريال)</label><input id="aAmt" type="number" inputmode="numeric" min="1" max="20000" placeholder="مثلاً 500">
      <label for="aReason">سبب السلفة</label>
      <select id="aReason"><option value="">اختار السبب</option><option>ظروف عائلية</option><option>علاج</option><option>إيجار سكن</option><option>سفر / إجازة</option><option>مصاريف السيارة</option><option>أخرى</option></select>
      <label for="aDet">تفاصيل (اختياري)</label><textarea id="aDet" maxlength="1500" placeholder="اكتب أي تفاصيل تساعد في الموافقة"></textarea>
      <div class="ibbox">
        <label for="aIban">🏦 الآيبان اللي هتنزل عليه السلفة</label>
        <div class="hint" id="ibNow"></div>
        <input id="aIban" dir="ltr" autocomplete="off" autocapitalize="characters" maxlength="34" placeholder="SA00 0000 0000 0000 0000 0000" style="text-align:left;letter-spacing:.5px">
        <div class="hint" id="ibBank"></div>
        <div class="hint">لازم يكون الآيبان باسمك إنت.</div>
      </div>
      <label for="aPh">رقم الجوال</label><input id="aPh" type="tel" inputmode="tel" maxlength="15" placeholder="05xxxxxxxx">
      <label class="chk"><input type="checkbox" id="aOk"> أوافق إن مبلغ السلفة يتخصم من راتبي حسب نظام الشركة، وإن بيانات الحساب البنكي صحيحة.</label>
      <button class="main" id="aSend" type="button">إرسال طلب السلفة</button>
      <div class="err" id="aErr"></div>
    </div>
  </section>

  <!-- الشكوى -->
  <section id="vCmp" class="hidden">
    <button class="back" type="button" data-go="home">→ رجوع</button>
    <div class="card"><h2>📝 تقديم شكوى</h2>
      <label for="cCat">نوع الشكوى</label>
      <select id="cCat"><option value="">اختار النوع</option><option>الراتب</option><option>خصم أو مديونية</option><option>البنزين / الشريحة</option><option>السيارة</option><option>المشرف</option><option>التطبيق / الحساب</option><option>أخرى</option></select>
      <label for="cDet">اكتب الشكوى بالتفصيل</label><textarea id="cDet" maxlength="1500" placeholder="إيه المشكلة؟ وإمتى حصلت؟"></textarea>
      <label for="cPh">رقم الجوال</label><input id="cPh" type="tel" inputmode="tel" maxlength="15" placeholder="05xxxxxxxx">
      <button class="main" id="cSend" type="button">إرسال الشكوى</button>
      <div class="err" id="cErr"></div>
    </div>
  </section>

  <!-- تم -->
  <section id="vDone" class="hidden">
    <div class="card lift done"><div class="big">✅</div><h2 id="dTitle">تم إرسال طلبك</h2><div class="hint" id="dSub">احتفظ برقم الطلب علشان تتابعه</div><div class="no" id="dNo"></div>
            <button class="main" type="button" data-go="list">طلباتي</button><button class="ghost" style="width:100%;margin-top:10px;padding:12px" type="button" data-go="home">الرجوع للرئيسية</button></div>
  </section>

  <!-- طلباتي -->
  <section id="vList" class="hidden">
    <button class="back" type="button" data-go="home">→ رجوع</button>
    <h2 style="margin:0 4px 10px">📋 طلباتي</h2>
    <div id="lBox"></div>
  </section>

</div>

async function openBlob(iq, blob, secret) {
  const rawb = Uint8Array.from(atob(blob), c => c.charCodeAt(0));
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: rawb.slice(0, 12) }, await deriveKey(secret), rawb.slice(12));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function login(raw) {
  err("err", "");

    if (PEND && PEND.needBd) { // الخطوة التانية: تاريخ الميلاد
      const d = $("bdD").value, m = $("bdM").value, y = $("bdY").value;
      if (!d || !m || !y) { err("err", "اختار اليوم والشهر والسنة."); return; }
      b.disabled = true; b.innerHTML = '<span class="spin"></span> جاري التحقق...';
      const secret = PEND.iq + "|" + y + "-" + m + "-" + d;
      let obj; try { obj = await openBlob(PEND.iq, PEND.blob, secret); } catch (e) { err("err", "تاريخ الميلاد مش مطابق لبيانات الإقامة. اتأكد منه وجرّب تاني، ولو المشكلة مستمرة كلم المشرف بتاعك."); return; }
      SECRET = secret; enter(PEND.iq, obj, (await sha256hex("tok:" + secret)).slice(0, 32)); return;
    }
    const iq = toLatin(raw).replace(/\D/g, "");
    if (!/^[12]\d{9}$/.test(iq)) { err("err", "رقم الإقامة لازم يكون 10 أرقام ويبدأ بـ 1 أو 2"); return; }
    b.disabled = true; b.innerHTML = '<span class="spin"></span> جاري البحث...';
    const data = await loadData();
    const rec = data.d[(await sha256hex("req:" + iq)).slice(0, 24)];
    if (!rec) { err("err", "رقم الإقامة ده مش مسجل عندنا. اتأكد من الرقم أو كلم المشرف بتاعك."); return; }
    const needBd = rec.startsWith("b:"), blob = rec.slice(2);
    if (needBd) { PEND = { iq, blob, needBd }; $("iqHint").classList.add("hidden"); $("bdBox").classList.remove("hidden"); return; }
    SECRET = iq; enter(iq, await openBlob(iq, blob, iq), (await sha256hex("tok:" + iq)).slice(0, 32));
  } catch (e) { err("err", "حصلت مشكلة في التحميل — جرّب تاني بعد شوية"); }
  finally { b.disabled = false; b.textContent = PEND && PEND.needBd ? "دخول" : "التالي"; }
}

async function send(p, btn, errId) {
  err(errId, "");
  if (!API) { err(errId, "الخدمة لسه بتتجهز — جرّب تاني بعد شوية."); return; }
  const label = btn.textContent; btn.disabled = true; btn.innerHTML = '<span class="spin"></span> جاري الإرسال...';
  try {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(p) });
    const j = await r.json();
    if (!j.ok) { err(errId, ERRS[j.err] || "الطلب ماتبعتش — جرّب تاني."); return; }
    $("dTitle").textContent = p.type === "سلفة" ? "تم إرسال طلب السلفة" : p.type === "آيبان" ? "تم إرسال الآيبان" : "تم إرسال الشكوى"; $("dSub").textContent = AUTO[p.type] || "احتفظ برقم الطلب علشان تتابعه من «طلباتي»";
    $("dNo").classList.remove("hidden"); $("dNo").textContent = j.no;
    ["aAmt", "aDet", "cDet", "aIban"].forEach(id => $(id).value = ""); $("ibBank").textContent = ""; $("aReason").value = ""; $("cCat").value = ""; $("aOk").checked = false;
    show("vDone");
  } catch (e) {
    err(errId, "مفيش اتصال دلوقتي — اتأكد من النت وجرّب تاني.");
  } finally { btn.disabled = false; btn.textContent = label; }
}
const phOk = v => /^0?5\d{8}$/.test(toLatin(v).replace(/\D/g, ""));

$("aSend").onclick = () => {
  const amt = Math.round(Number(toLatin($("aAmt").value)));
  if (!(amt > 0)) return err("aErr", "اكتب المبلغ المطلوب.");
  if (amt > 20000) return err("aErr", "المبلغ كبير جدًا.");
  if (!$("aReason").value) return err("aErr", "اختار سبب السلفة.");
  const ib = ibClean($("aIban").value);
  if (!ibOk(ib)) return err("aErr", "اكتب الآيبان صح: لازم يبدأ بـ SA وبعده 22 رقم — انسخه من تطبيق البنك.");
  const holder = ME.n || "";
  if (!phOk($("aPh").value)) return err("aErr", "اكتب رقم جوال صحيح (05xxxxxxxx).");
  if (!$("aOk").checked) return err("aErr", "لازم توافق على خصم السلفة من الراتب وصحة بيانات الحساب.");
  const det = $("aDet").value.trim();
  send(Object.assign(payload("سلفة"), { amount: amt, reason: $("aReason").value, iban: ib, bank: ibBank(ib), holder, details: (det ? det + "\n" : "") + "الآيبان: " + ibFmt(ib) + " (" + ibBank(ib) + ") — باسم المندوب", phone: toLatin($("aPh").value).replace(/\D/g, "") }), $("aSend"), "aErr");
};
$("cSend").onclick = () => {
  if (!$("cCat").value) return err("cErr", "اختار نوع الشكوى.");
  if ($("cDet").value.trim().length < 5) return err("cErr", "اكتب الشكوى بالتفصيل.");
  if (!phOk($("cPh").value)) return err("cErr", "اكتب رقم جوال صحيح (05xxxxxxxx).");
  send(Object.assign(payload("شكوى"), { reason: $("cCat").value, details: $("cDet").value.trim(), phone: toLatin($("cPh").value).replace(/\D/g, "") }), $("cSend"), "cErr");
};

/* ===== الآيبان ===== */
const BANKS = { "05": "مصرف الإنماء", "10": "البنك الأهلي السعودي", "15": "بنك البلاد", "20": "بنك الرياض", "30": "البنك العربي الوطني", "40": "البنك الأهلي السعودي (سامبا)", "45": "البنك السعودي الأول (ساب)", "50": "البنك السعودي الأول (الأول)", "55": "البنك السعودي الفرنسي", "60": "بنك الجزيرة", "65": "البنك السعودي للاستثمار", "71": "بنك الخليج الدولي", "76": "بنك مسقط", "80": "مصرف الراجحي", "90": "بنك الخليج الدولي", "95": "بنك الإمارات دبي الوطني" };
const ibClean = v => toLatin(v).toUpperCase().replace(/[^A-Z0-9]/g, "");
function ibOk(v) {
  const x = ibClean(v); if (!/^SA\d{22}$/.test(x)) return false;
  const r = x.slice(4) + x.slice(0, 4); let m = 0;
  for (const ch of r) { const n = /[A-Z]/.test(ch) ? String(ch.charCodeAt(0) - 55) : ch; for (const d of n) m = (m * 10 + +d) % 97; }
  return m === 1;
}
const ibBank = v => { const x = ibClean(v); return /^SA\d{4}/.test(x) ? (BANKS[x.slice(4, 6)] || "بنك آخر") : ""; };
const ibFmt = x => x.replace(/(.{4})/g, "$1 ").trim();
$("aIban").addEventListener("input", () => { err("aErr", ""); const x = ibClean($("aIban").value); $("ibBank").textContent = x.length >= 6 ? (ibBank(x) + (x.length === 24 ? (ibOk(x) ? " ✔ الرقم صحيح" : " ✖ الرقم فيه غلط") : "")) : ""; });

const ST = { "جديد": "s-new", "تحت المراجعة": "s-rev", "تمت الموافقة": "s-ok", "تم الحل": "s-ok", "مرفوض": "s-no" };
async function loadList() {
  const box = $("lBox");
  if (!API) { box.innerHTML = '<div class="card hint" style="text-align:center">متابعة الطلبات هتشتغل قريب.</div>'; return; }
  box.innerHTML = '<div class="card hint" style="text-align:center">جاري التحميل...</div>';
  try {
    const j = await (await fetch(API + "?action=status&iq=" + IQ + "&tok=" + TOK)).json();
    if (!j.ok) throw 0;
    box.innerHTML = j.list.length ? j.list.map(r => `<div class="req"><div class="top"><div class="t1">${r.type === "سلفة" ? "💰 سلفة" + (r.amount ? " — " + Number(r.amount).toLocaleString("en-US") + " ريال" : "") : r.type === "آيبان" ? "🏦 آيبان — " + esc(r.reason) : "📝 شكوى — " + esc(r.reason)}</div><span class="pill ${ST[r.status] || "s-new"}">${esc(r.status)}</span></div>
      <div class="t2">رقم الطلب <bdi dir="ltr">${esc(r.no)}</bdi> · <bdi dir="ltr">${esc(r.date)}</bdi></div>${r.reply ? `<div class="rep"><b>${r.by === "الشؤون القانونية" ? "⚖️ رد الشؤون القانونية" : "رد الإدارة"}:</b> ${esc(r.reply)}</div>` : (r.status === "جديد" || r.status === "تحت المراجعة") && AUTO[r.type] ? `<div class="rep auto"><b>🤖 رد تلقائي:</b> ${AUTO[r.type]}</div>` : ""}</div>`).join("")
      : '<div class="card hint" style="text-align:center">لسه مقدمتش أي طلبات.</div>';
  } catch (e) { box.innerHTML = '<div class="card hint" style="text-align:center">مقدرناش نجيب الطلبات دلوقتي — جرّب تاني بعد شوية.</div>'; }
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]"); if (!b) return;
  const g = b.dataset.go;
  if (g === "home") show("vHome"); else if (g === "adv") { if (!advOpen()) { advState(); toast(ADV_HOURS); return; } err("aErr", ""); $("ibNow").textContent = ME.ib ? "الآيبان المسجل عندنا بينتهي بـ " + ME.ib + " — اكتبه كامل للتأكيد، أو اكتب الجديد لو اتغيّر." : "اكتب رقم الآيبان بتاعك علشان السلفة تتحول عليه."; show("vAdv"); } else if (g === "cmp") { err("cErr", ""); show("vCmp"); } else if (g === "list") { show("vList"); loadList(); }
});
$("goBtn").onclick = () => login($("iqama").value);
$("iqama").addEventListener("keydown", e => { if (e.key === "Enter") $("goBtn").click(); });
$("outBtn").onclick = () => { store.del("tq_s"); ME = null; IQ = ""; TOK = ""; SECRET = ""; $("iqama").value = ""; $("heroSub").textContent = "طلب سلفة أو تقديم شكوى"; resetLogin(); show("vLogin"); };
$("iqama").addEventListener("input", () => { if (PEND) resetLogin(); });
(async () => { try { const s = JSON.parse(store.get("tq_s") || "null"); if (!s) return; const data = await loadData(); const rec = data.d[(await sha256hex("req:" + s.iq)).slice(0, 24)]; if (!rec) return;
  SECRET = s.s; enter(s.iq, await openBlob(s.iq, rec.slice(2), s.s), s.tok); } catch (e) { store.del("tq_s"); } })();
</script>
